<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">第一次游玩的五个查看位置</title>
  <desc id="desc">任务指明去哪，地图确认区域，技能检查能否使用，角色面板检查生存，背包比较装备。</desc>
  <rect width="960" height="430" rx="20" fill="#111514"/>
  <text x="40" y="59" fill="#e8ece5" font-size="29" font-weight="700" font-family="sans-serif">第一次游玩：先认这五处</text>
  <text x="40" y="91" fill="#a7b3a9" font-size="16" font-family="sans-serif">沿主线反复查看；位置和按键以游戏内设置为准</text>
  <path d="M124 222H838" stroke="#51674e" stroke-width="3" stroke-dasharray="8 10"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(40 132)"><rect width="164" height="178" rx="13" fill="#202a26" stroke="#b9d788"/><circle cx="82" cy="48" r="25" fill="#354532"/><text x="82" y="57" fill="#d8edb8" font-size="27">①</text><text x="82" y="102" fill="#fff" font-size="23" font-weight="700">任务</text><text x="82" y="133" fill="#b9c6b9" font-size="15">下一步做什么</text></g>
    <g transform="translate(219 132)"><rect width="164" height="178" rx="13" fill="#202a26" stroke="#53685c"/><circle cx="82" cy="48" r="25" fill="#354532"/><text x="82" y="57" fill="#d8edb8" font-size="27">②</text><text x="82" y="102" fill="#fff" font-size="23" font-weight="700">地图</text><text x="82" y="133" fill="#b9c6b9" font-size="15">区域与传送点</text></g>
    <g transform="translate(398 132)"><rect width="164" height="178" rx="13" fill="#202a26" stroke="#53685c"/><circle cx="82" cy="48" r="25" fill="#354532"/><text x="82" y="57" fill="#d8edb8" font-size="27">③</text><text x="82" y="102" fill="#fff" font-size="23" font-weight="700">技能</text><text x="82" y="133" fill="#b9c6b9" font-size="15">宝石与按键</text></g>
    <g transform="translate(577 132)"><rect width="164" height="178" rx="13" fill="#202a26" stroke="#53685c"/><circle cx="82" cy="48" r="25" fill="#354532"/><text x="82" y="57" fill="#d8edb8" font-size="27">④</text><text x="82" y="102" fill="#fff" font-size="23" font-weight="700">角色</text><text x="82" y="133" fill="#b9c6b9" font-size="15">生命与抗性</text></g>
    <g transform="translate(756 132)"><rect width="164" height="178" rx="13" fill="#202a26" stroke="#53685c"/><circle cx="82" cy="48" r="25" fill="#354532"/><text x="82" y="57" fill="#d8edb8" font-size="27">⑤</text><text x="82" y="102" fill="#fff" font-size="23" font-weight="700">背包</text><text x="82" y="133" fill="#b9c6b9" font-size="15">装备与通货</text></g>
  </g>
  <text x="40" y="365" fill="#dfbd7e" font-family="sans-serif" font-size="16">迷路时回到任务与地图；换装后回到技能与角色面板。</text>
</svg>
