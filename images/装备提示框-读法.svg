<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">装备提示框读法</title>
  <desc id="desc">示意装备提示框中名称、底材、基础防御、装备要求、自带属性、随机词缀、孔位和物品等级的位置。</desc>
  <rect width="960" height="620" rx="20" fill="#111514"/>
  <text x="36" y="52" fill="#e8ece5" font-family="sans-serif" font-size="28" font-weight="700">看懂一件装备 · 教学示意</text>
  <rect x="252" y="82" width="456" height="500" rx="11" fill="#202723" stroke="#9b8054" stroke-width="3"/>
  <text x="480" y="118" text-anchor="middle" fill="#e1c48b" font-family="sans-serif" font-size="24" font-weight="700">示例：坚固旅者外衣</text>
  <text x="480" y="145" text-anchor="middle" fill="#c9d1c7" font-family="sans-serif" font-size="16">稀有防具 · 示例底材</text>
  <path d="M270 165H690M270 244H690M270 317H690M270 376H690M270 483H690" stroke="#536157"/>
  <g fill="#e5e9df" font-family="sans-serif" font-size="18"><text x="284" y="195">基础防御：护甲 120</text><text x="284" y="225">基础防御：闪避 80</text><text x="284" y="274">要求等级 25</text><text x="284" y="302">要求力量 30、敏捷 20</text><text x="284" y="348">底材自带：某项固定属性</text><text x="284" y="410">随机词缀：最大生命 +42</text><text x="284" y="441">随机词缀：火焰抗性 +21%</text><text x="284" y="470">随机词缀：敏捷 +12</text><text x="284" y="517">孔位：可放符文 · 当前为空</text><text x="284" y="554" fill="#b9d788">按 Alt 查看：物品等级 35</text></g>
  <g font-family="sans-serif" font-size="17" font-weight="700"><text x="36" y="133" fill="#dfbd7e">① 名称与底材</text><text x="36" y="217" fill="#dfbd7e">② 基础数值</text><text x="36" y="293" fill="#dfbd7e">③ 穿戴要求</text><text x="36" y="363" fill="#dfbd7e">④ 自带属性</text><text x="36" y="439" fill="#dfbd7e">⑤ 随机词缀</text><text x="744" y="509" fill="#dfbd7e">⑥ 孔位</text><text x="744" y="555" fill="#b9d788">⑦ 物品等级</text></g>
  <g stroke="#dfbd7e" stroke-width="2" fill="none"><path d="M190 127H242"/><path d="M172 211H242"/><path d="M171 287H242"/><path d="M169 358H242"/><path d="M170 432H242"/><path d="M710 505H736"/></g><path d="M710 549H736" stroke="#b9d788" stroke-width="2"/>
</svg>
