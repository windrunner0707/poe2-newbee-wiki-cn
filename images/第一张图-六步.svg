<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">完成第一张异界地图的六步</title>
  <desc id="desc">从异界任务引导，到地图装置、相连节点、放引路石、开启传送门，最后击败地图首领。</desc>
  <rect width="960" height="450" rx="20" fill="#111514"/>
  <text x="38" y="55" fill="#e8ece5" font-family="sans-serif" font-size="28" font-weight="700">第一张图：只做这六步</text>
  <text x="38" y="84" fill="#a7b3a9" font-family="sans-serif" font-size="16">先完成，再考虑高塔、要塞和刷钱机制</text>
  <path d="M142 195H818" stroke="#6d8865" stroke-width="3" stroke-dasharray="8 9"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(28 129)"><rect width="138" height="139" rx="12" fill="#202a26" stroke="#b9d788"/><text x="69" y="39" fill="#dfbd7e" font-size="27">①</text><text x="69" y="78" fill="#f3f5ed" font-size="20" font-weight="700">跟随引导</text><text x="69" y="110" fill="#adbaae" font-size="14">与 NPC 对话</text></g>
    <g transform="translate(181 129)"><rect width="138" height="139" rx="12" fill="#202a26" stroke="#53685c"/><text x="69" y="39" fill="#dfbd7e" font-size="27">②</text><text x="69" y="78" fill="#f3f5ed" font-size="20" font-weight="700">地图装置</text><text x="69" y="110" fill="#adbaae" font-size="14">打开图鉴</text></g>
    <g transform="translate(334 129)"><rect width="138" height="139" rx="12" fill="#202a26" stroke="#53685c"/><text x="69" y="39" fill="#dfbd7e" font-size="27">③</text><text x="69" y="78" fill="#f3f5ed" font-size="20" font-weight="700">相连节点</text><text x="69" y="110" fill="#adbaae" font-size="14">选普通地图</text></g>
    <g transform="translate(487 129)"><rect width="138" height="139" rx="12" fill="#202a26" stroke="#53685c"/><text x="69" y="39" fill="#dfbd7e" font-size="27">④</text><text x="69" y="78" fill="#f3f5ed" font-size="20" font-weight="700">引路石</text><text x="69" y="110" fill="#adbaae" font-size="14">读词缀再放入</text></g>
    <g transform="translate(640 129)"><rect width="138" height="139" rx="12" fill="#202a26" stroke="#53685c"/><text x="69" y="39" fill="#dfbd7e" font-size="27">⑤</text><text x="69" y="78" fill="#f3f5ed" font-size="20" font-weight="700">开启进入</text><text x="69" y="110" fill="#adbaae" font-size="14">按界面按钮</text></g>
    <g transform="translate(793 129)"><rect width="138" height="139" rx="12" fill="#202a26" stroke="#b9d788"/><text x="69" y="39" fill="#dfbd7e" font-size="27">⑥</text><text x="69" y="78" fill="#f3f5ed" font-size="20" font-weight="700">击败首领</text><text x="69" y="110" fill="#adbaae" font-size="14">确认节点完成</text></g>
  </g>
  <rect x="38" y="316" width="884" height="77" rx="9" fill="#263229" stroke="#536157"/>
  <text x="480" y="350" text-anchor="middle" fill="#e8ece5" font-family="sans-serif" font-size="18">首次只用能承受的低阶引路石；不要为了一次地图叠高投入石板。</text>
  <text x="480" y="378" text-anchor="middle" fill="#dfbd7e" font-family="sans-serif" font-size="15">失败后先检查角色与词缀，再决定是否重试。</text>
</svg>
